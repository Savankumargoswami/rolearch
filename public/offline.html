<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline · Rolearch</title>
<style>
  :root { --paper: #f4f5f1; --ink: #0e1f2f; --muted: #5b6672; --signal: #e0a35b; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0e1f2f; --ink: #f4f5f1; --muted: #a9b3bd; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 26rem; padding: 2rem 1rem; text-align: center; }
  img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; text-wrap: balance; }
  p { color: var(--muted); margin: 0 0 1.5rem; text-wrap: pretty; }
  button { min-height: 48px; padding: 0 1.5rem; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper);
           font: inherit; font-weight: 600; cursor: pointer; }
  button:active { transform: scale(.96); }
</style>
</head>
<body>
<main>
  <img src="/pwa-192x192.png" alt="">
  <h1>You're offline</h1>
  <p>Rolearch needs a connection to show jobs. Check your connection, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
